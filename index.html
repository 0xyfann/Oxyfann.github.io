<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Saya</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
    }
    header {
      padding: 60px 20px;
      background: #1e293b;
    }
    h1 { color: #38bdf8; }
    section { padding: 30px 20px; }
    .card {
      max-width: 400px;
      margin: 20px auto;
      padding: 20px;
      background: #1e293b;
      border-radius: 15px;
    }
    footer {
      padding: 20px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <header>
    <h1>Halo, Selamat Datang!</h1>
    <p>Ini adalah website pribadi saya.</p>
  </header>
  <section>
    <div class="card">
      <h2>Tentang Saya</h2>
      <p>Selamat datang di website sederhana saya.</p>
    </div>
    <div class="card">
      <h2>Terima Kasih</h2>
      <p>Terima kasih sudah berkunjung!</p>
    </div>
  </section>
  <footer>
    © 2026 Website Saya
  </footer>
</body>
</html>
